version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: incheon-projman
    restart: always
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/prisma/dev.db
    volumes:
      - incheon_db_data:/app/prisma

volumes:
  incheon_db_data:
